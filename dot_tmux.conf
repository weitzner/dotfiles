#### COLOUR (Solarized dark)

# default statusbar colors
set-option -g status-style "fg=yellow,bg=black"

# default window title colors
set-window-option -g window-status-style fg=brightblue,bg=default,dim

# active window title colors
set-window-option -g window-status-current-style fg=brightred,bg=default,bright

# pane border
set-option -g pane-border-style fg=black
set-option -g pane-active-border-style fg=brightgreen

# message text
set-option -g message-style fg=brightred,bg=black

# pane number display
set-option -g display-panes-active-colour blue
set-option -g display-panes-colour brightred

# clock
set-window-option -g clock-mode-colour green

set-option -sg escape-time 0

set-option -g history-limit 100000

# sane scrolling
set-option -g terminal-overrides 'xterm*:smcup@:rmcup@'

set-option -g mouse on

# native clipboard passthrough (OSC 52) -- modern tmux + iTerm2 don't need
# the reattach-to-user-namespace shim this replaced
set-option -g set-clipboard on

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# statusbar
set -g status-left-length 50
set -g status-right-length 100

# %% (not %) is required after battery.sh's output -- status-right passes
# through strftime(), which silently swallows a bare literal % (this bit us
# once already: the original pmset-based version had the same bug, just
# never noticed since it only manifested below 100% charge).
if-shell 'test "$(uname -s)" = Darwin' \
    'set-option -g status-right "#[fg=green,bg=default]#h #[fg=brightred,bg=default]♥ #(~/.config/tmux/battery.sh)%% #[default]%a%l:%M %p %Y-%m-%d"' \
    'set-option -g status-right "#[fg=green,bg=default]#h #[fg=brightred,bg=default] #[default]%a%l:%M %p %Y-%m-%d"'
